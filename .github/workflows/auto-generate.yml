name: Авто-генерация статей

on:
  schedule:
    # Запуск каждый день в 06:30 UTC (09:30 по Киеву)
    - cron: '30 6 * * *'
  workflow_dispatch: # Возможность ручного запуска

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Проверка репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Запускаем генератор статьи
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate.js

      - name: 4. Публикуем созданную статью и обновленный index.html в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto: publish new article and update main page [skip ci]" || exit 0
          git push origin main