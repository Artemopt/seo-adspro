name: Авто-генерация статей

on:
  schedule:
    # Запуск каждый день в 09:00 UTC (12:00 по Киеву/МСК)
    - cron: '0 9 * * *'
  workflow_dispatch: # Возможность ручного запуска из вкладки Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачиваем репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Запускаем генератор статьи
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate.js

      - name: 4. Публикуем созданную статью и обновленный index.html в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-generated new article [skip ci]" && git pull origin main --rebase && git push origin main)